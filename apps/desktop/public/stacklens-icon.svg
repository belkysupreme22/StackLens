<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#182a1d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="1"/>
    </radialGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5be37e"/>
      <stop offset="50%" stop-color="#47ab61"/>
      <stop offset="100%" stop-color="#2a7741"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="lens-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Container Surface with subtle border -->
  <rect width="128" height="128" rx="28" fill="url(#bg-glow)" stroke="#26262a" stroke-width="2"/>

  <!-- Outer Lens Precision Ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#lens-ring)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Secondary Focus Aperture -->
  <circle cx="64" cy="64" r="38" fill="#131315" fill-opacity="0.6" stroke="#47ab61" stroke-opacity="0.2" stroke-width="1"/>

  <!-- The Stack Slices (representing Android Framework layers) -->
  <!-- Layer 1 (Top / UI Frameworks: Flutter, Compose, RN) -->
  <path d="M 64 34 L 88 47 L 64 60 L 40 47 Z" fill="url(#emerald-grad)" filter="url(#soft-glow)"/>

  <!-- Layer 2 (Middle / Native Runtimes & Bytecode) -->
  <path d="M 40 56 L 64 69 L 88 56 L 88 62 L 64 75 L 40 62 Z" fill="#47ab61" fill-opacity="0.75"/>

  <!-- Layer 3 (Bottom / Kernel & Android Hardware Engine) -->
  <path d="M 40 71 L 64 84 L 88 71 L 88 77 L 64 90 L 40 77 Z" fill="#2a7741" fill-opacity="0.9"/>

  <!-- Precision Focal Reticle Dots -->
  <circle cx="64" cy="20" r="1.5" fill="#47ab61"/>
  <circle cx="108" cy="64" r="1.5" fill="#47ab61"/>
  <circle cx="64" cy="108" r="1.5" fill="#47ab61"/>
  <circle cx="20" cy="64" r="1.5" fill="#47ab61"/>
</svg>